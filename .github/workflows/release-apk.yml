name: Build & release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compute version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ]; then
            echo "Tag must look like vMAJOR.MINOR.PATCH (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          PATCH="${PATCH:-0}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: |
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            for cand in "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$cand" ]; then SM="$cand"; break; fi
            done
          fi
          if [ -z "$SM" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found (ANDROID_HOME=${ANDROID_HOME:-unset})" >&2
            exit 1
          fi
          echo "Using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build static web assets
        run: NEXT_OUTPUT=export bunx next build

      - name: Sync Capacitor (copy web assets into the Android project)
        run: bunx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 repo secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.keystore
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/android/release.keystore" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Package APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/tobbaco-v${APP_VERSION_NAME}.apk"
          sha256sum "dist/tobbaco-v${APP_VERSION_NAME}.apk" | tee "dist/tobbaco-v${APP_VERSION_NAME}.apk.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tobbaco-v${{ env.APP_VERSION_NAME }}
          path: dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/tobbaco-v${APP_VERSION_NAME}.apk" \
            "dist/tobbaco-v${APP_VERSION_NAME}.apk.sha256" \
            --title "Inventory & Sales v${APP_VERSION_NAME}" \
            --notes "Android APK (v${APP_VERSION_NAME}, versionCode ${APP_VERSION_CODE}) — offline, no server required. Verify with the .sha256 file." \
            --verify-tag
